name: Feature request
description: Something DEA should decode, extract or do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to decode or build?
      description: A site and the result you are after helps most.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What DEA gives you today
  - type: textarea
    id: idea
    attributes:
      label: Your idea
