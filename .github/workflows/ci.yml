name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (dist/, plain node)
        run: pnpm build
      - name: Pack both packages and run them from the tarballs (no publish)
        run: node scripts/pack-smoke.mjs

  smoke:
    name: Real browser smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dea/core exec playwright install --with-deps chromium
      - name: dea stack on a three.js example
        run: |
          pnpm -s dea stack https://threejs.org/examples/webgl_animation_keyframes.html --browser chromium --json > stack.json
          cat stack.json
          grep -q '"name": "three.js"' stack.json
      - name: Real-browser tests (the MCP tools against a real site, record and replay, hands)
        run: |
          set +e
          pnpm test:e2e 2>&1 | tee e2e.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # put the failing assertions into the run's annotations, where they can be read without opening the full log
            grep -E 'FAIL|AssertionError|Error:|Timeout|expected' e2e.log | head -20 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
          fi
          exit "$code"

  windows:
    name: Windows (unit tests + Edge smoke test)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and run the packed tarballs
        run: |
          pnpm build
          node scripts/pack-smoke.mjs
      - name: dea stack in Microsoft Edge (preinstalled on the runner)
        shell: pwsh
        run: |
          pnpm -s dea stack https://threejs.org/examples/webgl_animation_keyframes.html --browser msedge --json | Out-File -Encoding utf8 stack.json
          Get-Content stack.json
          if (-not (Select-String -Path stack.json -Pattern '"name": "three.js"' -Quiet)) { throw 'three.js not detected' }
      - name: DEA Hub on Windows (config file, permissions, history)
        shell: pwsh
        run: |
          $env:DEA_HUB_HOME = "$env:RUNNER_TEMP\dea-hub"
          pnpm -s dea hub list
          pnpm -s dea mcp install --client vscode --project --hub --dry-run
      - name: "dea doctor and dea bench in Microsoft Edge - a runner has no graphics card, software WebGL is the expected answer"
        shell: pwsh
        run: |
          pnpm -s dea doctor --browser msedge --json | Out-File -Encoding utf8 doctor.json
          Get-Content doctor.json
          pnpm -s dea bench --browser msedge --out bench-out
          Get-Content bench-out/dea-bench.md
          $b = Get-Content bench-out/dea-bench.json -Raw | ConvertFrom-Json
          if ($b.result.gpu.kind -eq 'hardware' -and $null -eq $b.meta.timings) { throw 'a hardware GPU must carry timings' }
          if ($b.result.gpu.kind -ne 'hardware' -and $null -ne $b.meta.timings) { throw 'software or no WebGL must not carry speed numbers' }
          if ($b.result.gpu.kind -eq 'software' -and $b.meta.label -ne 'software render, not a speed measure') { throw 'software must be labelled' }
          if ($env:COMPUTERNAME -and ((Get-Content bench-out/dea-bench.json -Raw) -like "*$env:COMPUTERNAME*")) { throw 'the result names the machine' }
      - name: "DEA browser profile on Windows - a folder of its own, never the everyday profile"
        shell: pwsh
        run: |
          $env:DEA_PROFILES_HOME = "$env:RUNNER_TEMP\dea-profiles"
          pnpm -s dea browser profiles
          pnpm -s test:e2e packages/core/test/round10.e2e.test.ts
