name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    name: Real browser smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @dea/core exec playwright install --with-deps chromium
      - name: dea stack on a three.js example
        run: |
          pnpm -s dea stack https://threejs.org/examples/webgl_animation_keyframes.html --browser chromium --json > stack.json
          cat stack.json
          grep -q '"name": "three.js"' stack.json
      - name: MCP tool test against a real site
        run: pnpm test:e2e
